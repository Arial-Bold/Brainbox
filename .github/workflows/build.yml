name: Build BrainBox

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v5

      - name: Download Flite and mbedTLS
        run: sh get-deps.sh

      - name: Build the .dol
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/extremscorner/libogc2:latest make

      - name: Gather files for the SD card
        run: |
          mkdir -p package/brainbox
          cp brainbox_GC.dol package/brainbox/default.dol
          cp dist/cacert.pem package/brainbox/cacert.pem
          cp dist/voice_scotty.flitevox dist/voice_her.flitevox package/brainbox/
          if [ -f dist/opening.bnr ]; then cp dist/opening.bnr package/brainbox/opening.bnr; fi

      - name: Upload result
        uses: actions/upload-artifact@v6
        with:
          name: brainbox
          path: package/
